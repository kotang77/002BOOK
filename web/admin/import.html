<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>002BOOK · 데이터 가져오기</title>
<link rel="stylesheet" href="/pages.css">
<script src="/runtime/config.js"></script><script src="/runtime/claude-shim.js"></script></head>
<body><main class="pg">
<h1>데이터 가져오기 <small>관리자 전용 · 한 번만</small></h1>
<p>Claude 게시본에서 내려받은 <b>002book-export.json</b>을 002book.com 서버로 옮겨요. 회원 비밀번호는 그대로 쓸 수 있고, 첫 로그인 때 더 안전한 방식으로 자동으로 바뀌어요.</p>
<form id="f">
  <label>내보내기 파일<input type="file" id="file" accept=".json,application/json" required></label>
  <label>관리자(kotang77) 비밀번호<input type="password" id="pw" autocomplete="current-password" required></label>
  <button class="btn" type="submit">가져오기 시작</button>
</form>
<pre id="log" class="log"></pre>
</main>
<script>
const log=t=>{document.getElementById('log').textContent+=t+'\n'};
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;
  try{
    const j=JSON.parse(await document.getElementById('file').files[0].text());
    if(j.format!=='002book-export')throw new Error('002BOOK 내보내기 파일이 아니에요');
    const pw=document.getElementById('pw').value, call=window.__002.server.call;
    const all=Object.entries(j.docs), mem=all.filter(([k])=>k.startsWith('members/')), rest=all.filter(([k])=>!k.startsWith('members/'));
    log('문서 '+all.length+'건 (회원 '+mem.length+'명)');
    let r=await call('admin.import',{docs:Object.fromEntries(mem),pw});log('회원 '+r.docs+'명, 계정 '+r.accounts+'개 옮김');
    await window.__002.auth.login('kotang77',pw);log('관리자 로그인 완료');
    // 사진이 들어 있어서 크기 기준으로 나눠 보낸다
    let batch={},size=0,n=0;
    const flush=async()=>{if(!size)return;const x=await call('admin.import',{docs:batch});n+=x.docs;log('… '+n+'/'+rest.length);batch={};size=0};
    for(const [k,v] of rest){const s=JSON.stringify(v).length;if(size+s>3e6)await flush();batch[k]=v;size+=s}
    await flush();
    log('완료! 이제 002book.com 에서 원래 아이디·비밀번호로 로그인하면 돼요.');
  }catch(err){log('실패: '+(err.message||err))}
  b.disabled=false;
};
</script></body></html>
