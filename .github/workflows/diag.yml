name: 진단 (서버 비밀값)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: supabase/setup-cli@v1
      - name: 비밀값이 있는지만 확인 (값은 출력하지 않음)
        run: |
          for k in ANTHROPIC_API_KEY RESEND_API_KEY; do [ -n "${!k}" ] && echo "GitHub 비밀값 $k: 있음" || echo "GitHub 비밀값 $k: 없음"; done
          echo "서버(Supabase)에 설정된 비밀값 이름:"
          supabase secrets list --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" | awk -F'|' 'NR>2{gsub(/ /,"",$1);print " - "$1}'
