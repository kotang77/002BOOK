name: 배포 (웹사이트 + 서버)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  server:
    name: 서버(Supabase) 배포
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: 프로젝트 연결
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" -p "$SUPABASE_DB_PASSWORD"
      - name: DB 스키마 적용
        run: supabase db push --linked -p "$SUPABASE_DB_PASSWORD"
      - name: 비밀값 설정
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM || '002BOOK <no-reply@002book.com>' }}
          PLANS_JSON: ${{ vars.PLANS_JSON }}
        run: |
          args=("SITE_URL=https://002book.com" "ALLOWED_ORIGINS=https://002book.com,https://www.002book.com" "MAIL_FROM=$MAIL_FROM")
          for k in ANTHROPIC_API_KEY RESEND_API_KEY TOSS_SECRET_KEY PLANS_JSON; do
            [ -n "${!k}" ] && args+=("$k=${!k}")
          done
          supabase secrets set "${args[@]}" --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - name: API 함수 배포
        run: supabase functions deploy api --no-verify-jwt --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"

  web:
    name: 웹사이트 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: 빌드 (원본 앱 패치 + PWA + 아이콘)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          ANDROID_SHA256: ${{ vars.ANDROID_SHA256 }}
        run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  pages:
    name: GitHub Pages 공개
    needs: [web]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
