name: 배포 (웹사이트 + 서버)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  server:
    name: 서버(Supabase) 배포
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: DB 스키마 적용 (Management API, DB 비밀번호 불필요)
        run: |
          set -e
          for f in supabase/migrations/*.sql; do
            echo "적용: $f"
            python3 - "$f" > /tmp/body.json <<'PY'
          import json,sys
          print(json.dumps({"query": open(sys.argv[1],encoding="utf-8").read()}))
          PY
            code=$(curl -sS -o /tmp/out.txt -w "%{http_code}" -X POST \
              "https://api.supabase.com/v1/projects/${{ vars.SUPABASE_PROJECT_REF }}/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" --data @/tmp/body.json)
            echo "HTTP $code"
            if [ "$code" -ge 300 ]; then cat /tmp/out.txt; exit 1; fi
          done
      - name: 비밀값 설정
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          NL_CERT_KEY: ${{ secrets.NL_CERT_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          KMDB_KEY: ${{ secrets.KMDB_KEY }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          MAIL_FROM: ${{ vars.MAIL_FROM || '002BOOK <no-reply@002book.com>' }}
          FREE_LAUNCH: ${{ vars.FREE_LAUNCH || '1' }}
          PLANS_JSON: ${{ vars.PLANS_JSON }}
        run: |
          args=("SITE_URL=https://002book.com" "ALLOWED_ORIGINS=https://002book.com,https://www.002book.com" "MAIL_FROM=$MAIL_FROM" "FREE_LAUNCH=$FREE_LAUNCH")
          for k in ANTHROPIC_API_KEY RESEND_API_KEY TOSS_SECRET_KEY NL_CERT_KEY KAKAO_REST_KEY TMDB_TOKEN KMDB_KEY GOOGLE_CLIENT_ID PLANS_JSON; do
            [ -n "${!k}" ] && args+=("$k=${!k}")
          done
          supabase secrets set "${args[@]}" --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --yes
      - name: API 함수 배포
        run: supabase functions deploy api --no-verify-jwt --use-api --yes --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"

  web:
    name: 웹사이트 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: 빌드 (원본 앱 패치 + PWA + 아이콘)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          ANDROID_SHA256: ${{ vars.ANDROID_SHA256 }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  pages:
    name: GitHub Pages 공개
    needs: [web]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
