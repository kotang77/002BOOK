name: 안드로이드 앱 만들기 (구글 플레이용 .aab)

# Actions 탭에서 'Run workflow'로 실행한다.
# 처음 한 번은 서명 키가 없으므로 키를 새로 만들어 결과물(android-keystore)로 내려준다.
#  → 그 파일을 base64로 바꿔 저장소 Secrets 'ANDROID_KEYSTORE_B64'에 넣고,
#    만들 때 쓴 비밀번호를 'ANDROID_KEYSTORE_PASSWORD'에 넣는다. (키를 잃어버리면 앱을 업데이트할 수 없으니 꼭 따로 보관)
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: '버전 이름 (예: 1.0.0)'
        required: true
        default: '1.0.0'
      versionCode:
        description: '버전 번호 (올릴 때마다 1씩 증가)'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g @bubblewrap/cli@1

      - name: 서명 키 준비
        working-directory: android
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android.keystore
          else
            if [ -z "$KS_PASS" ]; then echo "::error::Secrets에 ANDROID_KEYSTORE_PASSWORD(8자 이상)를 먼저 넣어 주세요"; exit 1; fi
            keytool -genkeypair -v -keystore android.keystore -alias 002book -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=002BOOK, O=002BOOK, C=KR"
            echo "NEW_KEY=1" >> $GITHUB_ENV
          fi
          echo "### 서명 키 SHA-256 (ANDROID_SHA256 변수에 넣기)" >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore android.keystore -alias 002book -storepass "$KS_PASS" | grep 'SHA256:' | sed 's/.*SHA256: //' | tee -a $GITHUB_STEP_SUMMARY

      - name: 버전 반영
        working-directory: android
        run: |
          node -e "const f='twa-manifest.json',m=require('./'+f);m.appVersionName='${{ inputs.versionName }}';m.appVersionCode=+'${{ inputs.versionCode }}';require('fs').writeFileSync(f,JSON.stringify(m,null,2))"

      - name: Bubblewrap 설정
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: 앱 프로젝트 생성·빌드
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          yes | bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
          bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: 002book-android-${{ inputs.versionName }}
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk

      - name: 새로 만든 서명 키 내려받기 (처음 한 번만)
        if: env.NEW_KEY == '1'
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore-KEEP-SAFE
          path: android/android.keystore
          retention-days: 3
