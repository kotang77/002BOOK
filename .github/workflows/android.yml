name: 안드로이드 앱 만들기 (구글 플레이용 .aab)

# Actions 탭에서 'Run workflow'로 실행한다.
# 처음 한 번은 서명 키가 없으므로 키를 새로 만들어 결과물(android-keystore)로 내려준다.
#  → 그 파일을 base64로 바꿔 저장소 Secrets 'ANDROID_KEYSTORE_B64'에 넣고,
#    만들 때 쓴 비밀번호를 'ANDROID_KEYSTORE_PASSWORD'에 넣는다. (키를 잃어버리면 앱을 업데이트할 수 없으니 꼭 따로 보관)
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: '버전 이름 (예: 1.0.0)'
        required: true
        default: '1.0.0'
      versionCode:
        description: '버전 번호 (올릴 때마다 1씩 증가)'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 안드로이드 SDK 준비
        run: |
          SDK=$HOME/android-sdk
          mkdir -p $SDK/tools
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "build-tools;36.1.0" "platforms;android-36" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - run: npm i -g @bubblewrap/cli@1

      - name: 서명 키 준비
        working-directory: android
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > ks.bin
            # 암호화해 둔 키(openssl, 'Salted__'로 시작)면 비밀번호로 풀고, 아니면 그대로 쓴다
            if head -c 8 ks.bin | grep -q 'Salted__'; then openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KS_PASS -in ks.bin -out android.keystore; else mv ks.bin android.keystore; fi
            rm -f ks.bin
          else
            if [ -z "$KS_PASS" ]; then echo "::error::Secrets에 ANDROID_KEYSTORE_PASSWORD(8자 이상)를 먼저 넣어 주세요"; exit 1; fi
            keytool -genkeypair -v -keystore android.keystore -alias 002book -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=002BOOK, O=002BOOK, C=KR"
            echo "NEW_KEY=1" >> $GITHUB_ENV
            # 공개 저장소라 결과물은 누구나 받을 수 있어서, 키는 비밀번호로 암호화한 글자로만 내보낸다
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KS_PASS -in android.keystore | base64 -w0 > ANDROID_KEYSTORE_B64.txt
          fi
          echo "### 서명 키 SHA-256 (ANDROID_SHA256 변수에 넣기)" >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore android.keystore -alias 002book -storepass "$KS_PASS" | grep 'SHA256:' | sed 's/.*SHA256: //' | tee -a $GITHUB_STEP_SUMMARY

      - name: 버전 반영
        working-directory: android
        run: |
          node -e "const f='twa-manifest.json',m=require('./'+f);m.appVersionName='${{ inputs.versionName }}';m.appVersionCode=+'${{ inputs.versionCode }}';require('fs').writeFileSync(f,JSON.stringify(m,null,2))"

      - name: Bubblewrap 설정
        run: |
          mkdir -p ~/.bubblewrap ~/.gradle
          printf "org.gradle.logging.level=quiet\norg.gradle.console=plain\nandroid.suppressUnsupportedCompileSdk=36\n" > ~/.gradle/gradle.properties
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: 앱 프로젝트 생성·빌드
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          yes | bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
          bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: 002book-android-${{ inputs.versionName }}
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk

      - name: 새로 만든 서명 키 내려받기 (처음 한 번만, 암호화됨)
        if: env.NEW_KEY == '1'
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore-ENCRYPTED-KEEP-SAFE
          path: android/ANDROID_KEYSTORE_B64.txt
          retention-days: 3
